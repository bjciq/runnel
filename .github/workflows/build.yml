name: CI & Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Official release version (e.g. 1.2). Leave empty for dev build."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package
    runs-on: [self-hosted, instabox]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Mode
        id: meta
        run: |
          IS_OFFICIAL="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            IS_OFFICIAL="true"
            VER="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9] ]]; then
            IS_OFFICIAL="true"
            VER="${GITHUB_REF_NAME#v}"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v1.12")
            COMMITS=$(git rev-list --count "${LAST_TAG}..HEAD" 2>/dev/null || echo "${{ github.run_number }}")
            SHORT_SHA=$(git rev-parse --short HEAD)
            VER="${LAST_TAG#v}-dev.${COMMITS}+${SHORT_SHA}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "is_official=${IS_OFFICIAL}" >> "$GITHUB_OUTPUT"
          echo "Build Version: ${VER} (Official: ${IS_OFFICIAL})"

      - name: Setup Android SDK Cache & Licenses
        run: |
          export ANDROID_HOME="/data/home/android-sdk"
          export ANDROID_SDK_ROOT="/data/home/android-sdk"
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          chmod +x gradlew

      - name: Restore Signing Key
        env:
          KEYSTORE_B64: ${{ secrets.RUNNEL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/runnel.jks"
            echo "RUNNEL_KEYSTORE=$RUNNER_TEMP/runnel.jks" >> "$GITHUB_ENV"
          fi

      - name: Run Unit Tests
        env:
          ANDROID_HOME: /data/home/android-sdk
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Optimized Release APK
        id: build
        env:
          ANDROID_HOME: /data/home/android-sdk
          RUNNEL_KEYSTORE_PASSWORD: ${{ secrets.RUNNEL_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          
          mkdir -p dist
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ "${{ steps.meta.outputs.is_official }}" = "true" ]; then
            OUT_NAME="Runnel-${{ steps.meta.outputs.version }}.apk"
          else
            OUT_NAME="Runnel-dev-${{ steps.meta.outputs.version }}.apk"
          fi
          cp "$APK_SRC" "dist/${OUT_NAME}"
          echo "final_apk=dist/${OUT_NAME}" >> "$GITHUB_OUTPUT"
          echo "final_name=${OUT_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.final_name || 'runnel-apk' }}
          path: dist/*.apk
          retention-days: 7

      - name: Publish Official GitHub Release
        if: steps.meta.outputs.is_official == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            gh release create "v${{ steps.meta.outputs.version }}" dist/*.apk \
              --title "Runnel v${{ steps.meta.outputs.version }}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "v${{ steps.meta.outputs.version }}" dist/*.apk \
              --title "Runnel v${{ steps.meta.outputs.version }}" \
              --generate-notes
          fi

      - name: Update Development Pre-Release
        if: steps.meta.outputs.is_official == 'false' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "dev-latest" -y --cleanup-tag 2>/dev/null || true
          gh release create "dev-latest" dist/*.apk \
            --prerelease \
            --title "Runnel 开发尝鲜版 (${{ steps.meta.outputs.version }})" \
            --notes "由 GitHub Actions 基于提交 ${{ github.sha }} 自动构建的最新开发版 APK。"
